name: paygrow
description: PayGrow - speak your grocery list, PayGrow finds it and books it.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: '>=1.2.0 <2.0.0'
  record: '>=5.1.0 <7.0.0'
  just_audio: '>=0.9.40 <1.0.0'
  path_provider: '>=2.1.0 <3.0.0'
  url_launcher: '>=6.2.0 <7.0.0'

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
