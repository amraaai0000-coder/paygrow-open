<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PayGrow</title>
<style>
  :root {
    --black: #0a0a0b;
    --surface: #141416;
    --surface-alt: #1c1c1f;
    --line: #2a2a2e;
    --orange: #ff7a1a;
    --green: #01ca05;
    --grey: #8a8a8f;
    --white: #f7f7f8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* header */
  header {
    display: flex;
    align-items: center;
    padding: 12px 20px 8px;
    gap: 10px;
  }
  .menu {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .menu span { display: block; height: 2.2px; border-radius: 2px; margin: 2px 0; }
  .menu span:nth-child(1) { width: 15px; background: var(--orange); margin-left: 5px; }
  .menu span:nth-child(2) { width: 20px; background: var(--white); }
  .menu span:nth-child(3) { width: 20px; background: var(--white); }
  .title {
    flex: 1;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--green);
  }
  .spacer { width: 46px; flex: 0 0 auto; }

  /* chat */
  main { flex: 1; overflow-y: auto; padding: 4px 20px 16px; }
  .welcome {
    min-height: 60vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; text-align: center;
  }
  .welcome h1 { margin: 0 0 10px; font-size: 21px; font-weight: 700; }
  .step { display: flex; gap: 10px; align-items: flex-start; max-width: 320px; }
  .step .n {
    width: 20px; height: 20px; flex: 0 0 auto;
    border-radius: 50%;
    border: 1px solid rgba(1, 202, 5, 0.45);
    background: rgba(1, 202, 5, 0.16);
    color: var(--green); font-size: 10.5px; font-weight: 700;
    display: grid; place-items: center;
  }
  .step p { margin: 0; color: var(--grey); font-size: 12.5px; line-height: 1.45; text-align: left; }

  .msg { margin-top: 12px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: rgba(255, 122, 26, 0.16);
    border: 1px solid rgba(255, 122, 26, 0.35);
    border-radius: 16px;
    padding: 10px 14px;
    font-size: 13.5px;
    max-width: 82%;
  }
  .msg.bot { align-items: flex-start; padding-right: 24px; }
  .cards { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; width: 100%; align-items: flex-start; }
  .card {
    flex: 0 0 172px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .card .thumb {
    height: 110px; background: var(--surface-alt);
    display: grid; place-items: center; color: var(--grey); font-size: 10px;
    position: relative;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .num {
    position: absolute; top: 8px; left: 8px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--orange); color: #000;
    font-size: 12px; font-weight: 800;
    display: grid; place-items: center;
  }
  .card .body { padding: 10px; }
  .card .name { font-size: 12px; line-height: 1.35; height: 33px; overflow: hidden; margin-bottom: 4px; }
  .card .price { font-size: 13px; font-weight: 700; margin-top: 6px; }
  .card .meta { font-size: 10px; color: var(--grey); margin-top: 2px; }
  .card button {
    width: 100%; height: 32px; margin-top: 8px;
    border: 0; border-radius: 9px;
    background: var(--orange); color: #000;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .say { font-size: 13.5px; line-height: 1.5; margin-top: 10px; white-space: pre-wrap; }
  .draft .bubble { opacity: 0.92; }
  .draft .caret {
    display: inline-block; width: 2px; height: 14px;
    background: var(--orange); margin-left: 2px;
    vertical-align: -2px; animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .order {
    margin-top: 10px; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; font-size: 11.5px; color: var(--grey);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .order a, .order button {
    color: var(--orange); background: none; border: 0;
    font-size: 11.5px; cursor: pointer; text-decoration: none;
  }
  .err {
    margin-top: 10px; padding: 10px 12px;
    border: 1px solid rgba(255, 122, 26, 0.35);
    background: rgba(255, 122, 26, 0.10);
    border-radius: 14px; font-size: 12.5px;
  }

  /* stage shimmer */
  .stage { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .stage .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
  .stage .label {
    font-size: 12.5px; font-weight: 600;
    background: linear-gradient(90deg, #ff7a1a 0%, #ff7a1a 42%, #8a8a8f 55%, #ff7a1a 70%);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: sweep 1.5s linear infinite;
  }
  @keyframes sweep { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* composer */
  footer { padding: 0 20px 14px; }
  .composer {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 4px 6px 4px 16px;
  }
  .composer input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: none;
    color: var(--white); font-size: 13.5px; padding: 10px 0;
  }
  .composer input::placeholder { color: var(--grey); }
  .icon {
    width: 40px; height: 40px; flex: 0 0 auto;
    border: 0; border-radius: 50%;
    background: none; color: var(--white);
    display: grid; place-items: center; cursor: pointer;
    font-size: 17px;
  }
  .icon.voice { color: var(--orange); }
  .send {
    width: 40px; height: 40px; flex: 0 0 auto;
    border: 0; border-radius: 50%;
    background: var(--white); color: #000;
    display: grid; place-items: center; cursor: pointer;
    font-size: 18px;
  }

  /* recording bar */
  .rec {
    display: flex; align-items: center; gap: 8px;
    height: 56px; padding: 0 8px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 28px;
  }
  .rec .round {
    width: 40px; height: 40px; flex: 0 0 auto;
    border: 0; border-radius: 50%;
    background: var(--surface); color: var(--white);
    display: grid; place-items: center; cursor: pointer; font-size: 16px;
  }
  .rec .round.go { background: var(--white); color: #000; }
  .rec .live { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); animation: pulse 0.9s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .rec .hint { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec .clock { font-size: 11.5px; color: var(--grey); }
  .rec .bars { display: flex; gap: 2px; align-items: center; height: 22px; }
  .rec .bars i { width: 3px; border-radius: 2px; background: var(--orange); animation: level 0.9s infinite ease-in-out; }
  @keyframes level { 0%, 100% { height: 5px; } 50% { height: 18px; } }

  /* voice window */
  .voicewin {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 12px 12px 14px 16px;
  }
  .voicewin .row { display: flex; align-items: center; gap: 12px; }
  .orb {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255, 122, 26, 0.18);
    border: 1px solid rgba(255, 122, 26, 0.55);
    flex: 0 0 auto;
  }
  .orb i { width: 20px; height: 20px; border-radius: 50%; background: var(--orange); animation: orb 1.4s infinite ease-in-out; }
  @keyframes orb { 50% { transform: scale(1.25); } }
  .voicewin .label { font-size: 14px; font-weight: 600; }
  .voicewin .sub { font-size: 11.5px; color: var(--grey); margin-top: 3px; }
  .voicewin .muted .orb { background: rgba(138, 138, 143, 0.18); border-color: var(--grey); }
  .voicewin .muted .orb i { background: var(--grey); animation: none; }

  /* drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: 312px;
    background: var(--black); border-right: 1px solid var(--line);
    transform: translateX(-100%); transition: transform 0.22s ease;
    display: flex; flex-direction: column; padding: 18px 12px;
    overflow-y: auto;
  }
  .drawer.open { transform: translateX(0); }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 20px;
    background: rgba(255, 122, 26, 0.16);
    border: 1px solid rgba(255, 122, 26, 0.4);
    color: var(--orange); font-size: 12px; font-weight: 700;
  }
  .neworder {
    width: 100%; height: 42px; margin: 12px 0 10px;
    border-radius: 14px; cursor: pointer;
    background: none; color: var(--orange);
    border: 1px solid rgba(255, 122, 26, 0.45);
    font-size: 13px; font-weight: 600;
  }
  .sess {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .sess.active { border-color: rgba(255, 122, 26, 0.45); background: var(--surface-alt); }
  .sess .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; }
  .sess .top span:last-child { color: var(--grey); font-size: 10.5px; font-weight: 400; }
  .sess .sub { color: var(--grey); font-size: 10.5px; margin-top: 4px; }
  .sess .ord { display: flex; gap: 6px; font-size: 10.5px; color: var(--grey); margin-top: 4px; }
  .empty { color: var(--grey); font-size: 12px; padding: 8px 4px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="menu" id="menuBtn" role="button" aria-label="Open menu">
    <div><span></span><span></span><span></span></div>
  </div>
  <div class="title">PayGrow</div>
  <div class="spacer"></div>
</header>

<main id="chat"></main>

<footer id="footer"></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div><span class="tag">Order History</span></div>
  <button class="neworder" id="newOrder">+ New order</button>
  <div id="sessions"></div>
</aside>

<script>
(() => {
  "use strict";

  const SVG_MIC =
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/>' +
    '<path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';
  const SVG_CLOSE =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>';

  const $ = (id) => document.getElementById(id);
  const DEVICE = localStorage.getItem("pg_device") ||
    (() => {
      const id = "web-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("pg_device", id);
      return id;
    })();

  const STAGES = [
    "Understanding your order",
    "Picking the products",
    "Sending the list to the catalogue",
    "Pricing your basket",
    "Writing the answer",
  ];

  let sessionId = null;
  let lastCards = [];
  let busy = false;
  let stageTimer = null;
  let pendingOrder = null;

  // ── helpers ──────────────────────────────────────────────────────────────
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

  const money = (card) =>
    (card.currency === "INR" ? "₹" : "$") + Number(card.price || 0).toFixed(2);

  const headers = () => ({ "X-Device-Id": DEVICE });

  async function api(path, options = {}) {
    const res = await fetch(path, options);
    let body = {};
    try { body = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error(body.detail || ("Request failed (" + res.status + ")"));
    return body;
  }

  // ── chat rendering ───────────────────────────────────────────────────────
  function welcome() {
    return `
      <div class="welcome" id="welcome">
        <h1>Speak. Pick. Pay.</h1>
        <div class="step"><div class="n">1</div><p>Speak or type your shopping list</p></div>
        <div class="step"><div class="n">2</div><p>Tap a card number to book it</p></div>
        <div class="step"><div class="n">3</div><p>Approve the payment in PayPal</p></div>
      </div>`;
  }

  /// The words appear in a bubble as the speech is transcribed, before the
  /// turn is sent. Pressing the arrow turns this same bubble into the message.
  let draftBubble = null;

  function setDraft(text) {
    if (!draftBubble) {
      const w = $("welcome");
      if (w) w.remove();
      draftBubble = document.createElement("div");
      draftBubble.className = "msg user draft";
      draftBubble.innerHTML = '<div class="bubble"><span data-words></span><span class="caret"></span></div>';
      $("chat").appendChild(draftBubble);
    }
    const words = draftBubble.querySelector("[data-words]");
    if (words) words.textContent = text;
    scrollEnd();
  }

  function clearDraft() {
    if (draftBubble && draftBubble.parentNode) draftBubble.remove();
    draftBubble = null;
  }

  function addUser(text) {
    clearDraft();
    const w = $("welcome");
    if (w) w.remove();
    const el = document.createElement("div");
    el.className = "msg user";
    el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    $("chat").appendChild(el);
    scrollEnd();
  }

  function addBot(result) {
    const el = document.createElement("div");
    el.className = "msg bot";
    const cards = result.cards || [];
    lastCards = cards;

    const cardHtml = cards.length
      ? `<div class="cards">${cards.map((c) => `
          <div class="card">
            <div class="thumb">
              ${c.image ? `<img src="${esc(c.image)}" alt="" loading="lazy"
                   onerror="this.remove()" />` : ""}
              <div class="num">${c.card_no}</div>
            </div>
            <div class="body">
              <div class="name">${esc(c.title)}</div>
              <div class="price">${money(c)} × ${Number(c.quantity || 1)}</div>
              <div class="meta">${esc(c.price_source)} · ${esc(String(c.availability || "").replace(/_/g, " "))}</div>
              <button data-book="${c.card_no}">Book ${c.card_no}</button>
            </div>
          </div>`).join("")}</div>`
      : "";

    el.innerHTML = cardHtml +
      `<div class="say" data-say></div>` +
      (result.order ? orderHtml(result.order) : "") +
      (result.intent && result.intent !== "search"
        ? `<div class="meta" style="font-size:10px;color:var(--grey);margin-top:6px">${esc(result.intent)} · ${esc(result.llm_engine || "")}</div>`
        : "");

    $("chat").appendChild(el);
    el.querySelectorAll("[data-book]").forEach((btn) => {
      btn.onclick = () => book(Number(btn.dataset.book));
    });
    const orderBox = el.querySelector("[data-capture]");
    if (orderBox) orderBox.onclick = () => capture(orderBox.dataset.capture);

    scrollEnd();
    return el.querySelector("[data-say]");
  }

  function addError(message) {
    const el = document.createElement("div");
    el.className = "err";
    el.textContent = message;
    $("chat").appendChild(el);
    scrollEnd();
  }

  function orderHtml(order) {
    return `<div class="order">
      <span>${esc(order.order_id)} · ${esc(order.status)}${order.amount ? " · " + Number(order.amount).toFixed(2) + " " + esc(order.currency || "") : ""}</span>
      ${order.approve_url ? `<a href="${esc(order.approve_url)}" target="_blank" rel="noopener">Open PayPal</a>` : ""}
      ${order.status && order.status.toUpperCase() !== "COMPLETED"
        ? `<button data-capture="${esc(order.order_id)}">Capture</button>` : ""}
    </div>`;
  }

  function scrollEnd() {
    const main = $("chat");
    main.scrollTop = main.scrollHeight;
  }

  // ── stage label ──────────────────────────────────────────────────────────
  function startStages() {
    stopStages();
    const el = document.createElement("div");
    el.className = "stage";
    el.id = "stage";
    el.innerHTML = `<span class="dot"></span><span class="label">${STAGES[0]}</span>`;
    $("chat").appendChild(el);
    scrollEnd();
    let i = 0;
    stageTimer = setInterval(() => {
      i = (i + 1) % STAGES.length;
      const label = el.querySelector(".label");
      if (label) label.textContent = STAGES[i];
    }, 1500);
  }

  function stopStages() {
    if (stageTimer) clearInterval(stageTimer);
    stageTimer = null;
    const el = $("stage");
    if (el) el.remove();
  }

  // ── narration playback with word reveal ──────────────────────────────────
  function playChunks(chunks, target) {
    return new Promise((resolve) => {
      const buffer = [];
      let i = 0;

      const next = () => {
        if (i >= chunks.length) {
          target.textContent = buffer.join(" ").trim();
          resolve();
          return;
        }
        const chunk = chunks[i++];
        if (!chunk.audio) {
          buffer.push(chunk.text || "");
          target.textContent = buffer.join(" ").trim();
          next();
          return;
        }
        const audio = new Audio("data:audio/wav;base64," + chunk.audio);
        const words = String(chunk.text || "").split(" ");
        const reveal = () => {
          if (!audio.duration || !isFinite(audio.duration)) return;
          const shown = Math.floor((audio.currentTime / audio.duration) * words.length);
          target.textContent = buffer.concat([words.slice(0, shown).join(" ")]).join(" ").trim();
        };
        audio.ontimeupdate = reveal;
        audio.onended = () => {
          buffer.push(chunk.text || "");
          target.textContent = buffer.join(" ").trim();
          next();
        };
        audio.onerror = () => {
          buffer.push(chunk.text || "");
          target.textContent = buffer.join(" ").trim();
          next();
        };
        audio.play().catch(() => {
          buffer.push(chunk.text || "");
          target.textContent = buffer.join(" ").trim();
          next();
        });
      };
      next();
    });
  }

  // ── one turn ─────────────────────────────────────────────────────────────
  async function runTurn(send) {
    if (busy) return;
    busy = true;
    startStages();
    try {
      const result = await send();
      stopStages();
      const say = addBot(result);
      if (result.order) {
        pendingOrder = result.order;
        if (result.order.approve_url) window.open(result.order.approve_url, "_blank", "noopener");
      }
      await playChunks(result.audio || [], say);
      loadSessions();
    } catch (e) {
      stopStages();
      addError(e.message || String(e));
    } finally {
      busy = false;
    }
  }

  async function ensureSession() {
    if (sessionId) return sessionId;
    const created = await api("/api/sessions", { method: "POST", headers: headers() });
    sessionId = created.id;
    return sessionId;
  }

  async function sendText(text) {
    if (!text.trim()) return;
    addUser(text.trim());
    await ensureSession();
    await runTurn(() => api("/api/agent/understand", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...headers() },
      body: JSON.stringify({
        text: text.trim(),
        language: "auto",
        session_id: sessionId,
        cards: lastCards,
      }),
    }));
  }

  async function sendAudio(blob) {
    await ensureSession();
    const form = new FormData();
    form.append("file", blob, "voice.webm");
    form.append("language", "auto");
    form.append("session_id", sessionId);
    form.append("cards", JSON.stringify(lastCards));
    await runTurn(() => api("/api/agent/voice", { method: "POST", headers: headers(), body: form }));
  }

  async function book(cardNo) {
    const card = lastCards.find((c) => c.card_no === cardNo);
    if (!card) return;
    try {
      const order = await api("/api/checkout/paypal/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          lines: [{
            product_id: card.product_id,
            title: card.title,
            image: card.image,
            unit_price: card.price,
            quantity: card.quantity || 1,
          }],
        }),
      });
      pendingOrder = order;
      addUser("Book card " + cardNo);
      const el = document.createElement("div");
      el.className = "msg bot";
      el.innerHTML = `<div class="say">Order ${esc(order.order_id)} created. Approve it in PayPal, then capture.</div>` + orderHtml(order);
      $("chat").appendChild(el);
      const box = el.querySelector("[data-capture]");
      if (box) box.onclick = () => capture(box.dataset.capture);
      if (order.approve_url) window.open(order.approve_url, "_blank", "noopener");
      scrollEnd();
      loadSessions();
    } catch (e) {
      addError(e.message || String(e));
    }
  }

  async function capture(orderId) {
    try {
      const order = await api("/api/checkout/paypal/capture", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ order_id: orderId }),
      });
      const el = document.createElement("div");
      el.className = "msg bot";
      el.innerHTML = `<div class="say">${order.status === "COMPLETED"
        ? "Payment captured. Order " + esc(order.order_id) + " is complete."
        : "Order is still " + esc(order.status) + ". Approve it in PayPal first."}</div>` + orderHtml(order);
      $("chat").appendChild(el);
      scrollEnd();
      loadSessions();
    } catch (e) {
      addError(e.message || String(e));
    }
  }

  // ── sessions drawer ──────────────────────────────────────────────────────
  async function loadSessions() {
    try {
      const rows = await api("/api/sessions", { headers: headers() });
      const box = $("sessions");
      if (!rows.length) {
        box.innerHTML = `<div class="empty">No chats yet. Ask for something and it will appear here with its orders.</div>`;
        return;
      }
      box.innerHTML = rows.map((row) => `
        <div class="sess ${row.id === sessionId ? "active" : ""}" data-session="${esc(row.id)}">
          <div class="top"><span>${esc(row.title || "New order")}</span><span>${(row.created_at || "").slice(11, 16)}</span></div>
          <div class="sub">${row.message_count} messages · ${row.order_count} orders</div>
        </div>`).join("");
      box.querySelectorAll("[data-session]").forEach((el) => {
        el.onclick = () => openSession(el.dataset.session);
      });
    } catch (_) {}
  }

  async function openSession(id) {
    try {
      const detail = await api("/api/sessions/" + id, { headers: headers() });
      sessionId = id;
      lastCards = [];
      $("chat").innerHTML = welcome();
      (detail.messages || []).forEach((m) => {
        if (m.role === "user") {
          addUser(m.text);
        } else {
          const el = document.createElement("div");
          el.className = "msg bot";
          const cards = m.cards || [];
          if (cards.length) lastCards = cards;
          el.innerHTML = (cards.length ? `<div class="cards">${cards.map((c) => `
              <div class="card">
                <div class="thumb">${c.image ? `<img src="${esc(c.image)}" alt="" loading="lazy" onerror="this.remove()" />` : ""}<div class="num">${c.card_no}</div></div>
                <div class="body">
                  <div class="name">${esc(c.title)}</div>
                  <div class="price">${money(c)} × ${Number(c.quantity || 1)}</div>
                  <button data-book="${c.card_no}">Book ${c.card_no}</button>
                </div>
              </div>`).join("")}</div>` : "") + `<div class="say">${esc(m.text)}</div>`;
          $("chat").appendChild(el);
          el.querySelectorAll("[data-book]").forEach((btn) => {
            btn.onclick = () => book(Number(btn.dataset.book));
          });
        }
      });
      closeDrawer();
      scrollEnd();
    } catch (e) {
      addError(e.message || String(e));
    }
  }

  function openDrawer() { $("drawer").classList.add("open"); $("scrim").classList.add("open"); loadSessions(); }
  function closeDrawer() { $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); }

  // ── composer ─────────────────────────────────────────────────────────────
  function renderComposer() {
    $("footer").innerHTML = `
      <div class="composer" id="composer">
        <input id="input" type="text" placeholder="Type your list…" autocomplete="off" />
        <button class="icon" id="micBtn" title="Record"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
        <button class="icon voice" id="voiceBtn" title="Voice window"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 12h1.5"/><path d="M9 8v8"/><path d="M13 5v14"/><path d="M17 9v6"/><path d="M21 12h-1.5"/></svg></button>
        <button class="send hidden" id="sendBtn" title="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg></button>
      </div>`;
    const input = $("input");
    const send = $("sendBtn");
    input.addEventListener("input", () => {
      const typed = input.value.trim().length > 0;
      send.classList.toggle("hidden", !typed);
      $("micBtn").classList.toggle("hidden", typed);
      $("voiceBtn").classList.toggle("hidden", typed);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const text = input.value;
        input.value = "";
        input.dispatchEvent(new Event("input"));
        sendText(text);
      }
    });
    send.onclick = () => {
      const text = input.value;
      input.value = "";
      input.dispatchEvent(new Event("input"));
      sendText(text);
    };
    $("micBtn").onclick = startInlineRecording;
    $("voiceBtn").onclick = startVoiceWindow;
  }

  // ── inline recording (25 s chunks) ───────────────────────────────────────
  let mediaRecorder = null;
  let stream = null;
  let chunks = [];
  let transcript = "";
  let clockTimer = null;
  let chunkTimer = null;
  let elapsed = 0;

  function recordingBar() {
    $("footer").innerHTML = `
      <div class="rec">
        <button class="round" id="cancelRec" title="Cancel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
        <span class="live"></span>
        <span class="hint" id="recHint">Listening…</span>
        <span class="clock" id="recClock">00:00</span>
        <span class="bars" id="recBars">${"<i></i>".repeat(7)}</span>
        <button class="round go" id="sendRec" title="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg></button>
      </div>`;
    [...document.querySelectorAll("#recBars i")].forEach((bar, i) => {
      bar.style.animationDelay = (i * 0.09) + "s";
    });
    $("cancelRec").onclick = cancelRecording;
    $("sendRec").onclick = finishRecording;
  }

  async function startInlineRecording() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      addError("Microphone is not available: " + e.message);
      return;
    }
    transcript = "";
    elapsed = 0;
    recordingBar();
    clockTimer = setInterval(() => {
      elapsed += 1;
      const clock = $("recClock");
      if (clock) {
        clock.textContent =
          String(Math.floor(elapsed / 60)).padStart(2, "0") + ":" +
          String(elapsed % 60).padStart(2, "0");
      }
    }, 1000);
    await beginChunk();
  }

  async function beginChunk() {
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    mediaRecorder.start();
    clearTimeout(chunkTimer);
    // Sarvam takes 30 s per request, so each chunk is closed at 25 s.
    chunkTimer = setTimeout(() => flushChunk(true), 25000);
  }

  function flushChunk(restart) {
    return new Promise((resolve) => {
      if (!mediaRecorder || mediaRecorder.state !== "recording") { resolve(); return; }
      mediaRecorder.onstop = async () => {
        const blob = new Blob(chunks, { type: "audio/webm" });
        if (blob.size > 1000) {
          try {
            const form = new FormData();
            form.append("file", blob, "chunk.webm");
            form.append("language", "auto");
            const out = await api("/api/stt", { method: "POST", body: form });
            if (out.transcript) {
              transcript = (transcript + " " + out.transcript).trim();
              setDraft(transcript);
              const hint = $("recHint");
              if (hint) hint.textContent = "Listening…";
            }
          } catch (_) {}
        }
        if (restart) await beginChunk();
        resolve();
      };
      mediaRecorder.stop();
    });
  }

  async function cancelRecording() {
    clearInterval(clockTimer);
    clearTimeout(chunkTimer);
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.onstop = null;
      mediaRecorder.stop();
    }
    if (stream) stream.getTracks().forEach((t) => t.stop());
    transcript = "";
    clearDraft();
    renderComposer();
  }

  async function finishRecording() {
    clearInterval(clockTimer);
    clearTimeout(chunkTimer);
    await flushChunk(false);
    if (stream) stream.getTracks().forEach((t) => t.stop());
    const text = transcript.trim();
    renderComposer();
    clearDraft();
    if (!text) {
      addError("Nothing was heard. Try again, a little closer to the mic.");
      return;
    }
    await sendText(text);
  }

  // ── voice window ─────────────────────────────────────────────────────────
  let voiceStream = null;
  let voiceCtx = null;
  let voiceRaf = null;
  let voiceRecorder = null;
  let voiceChunks = [];
  let voiceMuted = false;

  function voicePanel(state, sub) {
    $("footer").innerHTML = `
      <div class="voicewin ${voiceMuted ? "muted" : ""}">
        <div class="row">
          <div class="orb"><i></i></div>
          <div style="flex:1">
            <div class="label">${esc(state)}</div>
            <div class="sub">${esc(sub)}</div>
          </div>
          <button class="icon" id="muteBtn" title="Mute">${SVG_MIC}</button>
          <button class="icon" id="closeVoice" title="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
        </div>
      </div>`;
    $("closeVoice").onclick = stopVoiceWindow;
    $("muteBtn").onclick = toggleMute;
  }

  async function startVoiceWindow() {
    voiceMuted = false;
    try {
      voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      addError("Microphone is not available: " + e.message);
      return;
    }
    voicePanel("Connecting…", "Waking the server up.");
    try {
      await api("/health");
    } catch (_) {}
    listenOnce();
  }

  function toggleMute() {
    voiceMuted = !voiceMuted;
    if (voiceRecorder && voiceRecorder.state === "recording") {
      voiceRecorder.stop();
    }
    if (voiceMuted) {
      voicePanel("Muted", "Nothing is being recorded.");
    } else {
      listenOnce();
    }
  }

  function stopVoiceWindow() {
    if (voiceRaf) cancelAnimationFrame(voiceRaf);
    if (voiceRecorder && voiceRecorder.state === "recording") {
      voiceRecorder.onstop = null;
      voiceRecorder.stop();
    }
    if (voiceStream) voiceStream.getTracks().forEach((t) => t.stop());
    if (voiceCtx) voiceCtx.close().catch(() => {});
    voiceStream = null; voiceCtx = null; voiceRaf = null;
    renderComposer();
  }

  function listenOnce() {
    if (voiceMuted || !voiceStream) return;
    voicePanel("Listening", "Speak — it sends itself when you pause.");
    voiceChunks = [];
    voiceRecorder = new MediaRecorder(voiceStream);
    voiceRecorder.ondataavailable = (e) => { if (e.data.size) voiceChunks.push(e.data); };
    voiceRecorder.start();

    voiceCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = voiceCtx.createMediaStreamSource(voiceStream);
    const analyser = voiceCtx.createAnalyser();
    analyser.fftSize = 1024;
    source.connect(analyser);
    const data = new Uint8Array(analyser.fftSize);
    let heard = false;
    let quietSince = 0;
    const startedAt = Date.now();

    const tick = () => {
      if (!voiceStream || voiceMuted) return;
      analyser.getByteTimeDomainData(data);
      let peak = 0;
      for (let i = 0; i < data.length; i++) {
        peak = Math.max(peak, Math.abs(data[i] - 128));
      }
      const now = Date.now();
      if (peak > 8) {
        heard = true;
        quietSince = 0;
      } else if (heard && !quietSince) {
        quietSince = now;
      }
      // 450 ms of quiet after speech, or 20 s at most
      if ((heard && quietSince && now - quietSince > 450) || now - startedAt > 20000) {
        finishVoiceTurn();
        return;
      }
      voiceRaf = requestAnimationFrame(tick);
    };
    tick();
  }

  async function finishVoiceTurn() {
    if (voiceRaf) cancelAnimationFrame(voiceRaf);
    if (voiceRecorder && voiceRecorder.state === "recording") {
      await new Promise((resolve) => {
        voiceRecorder.onstop = resolve;
        voiceRecorder.stop();
      });
    }
    if (voiceCtx) { voiceCtx.close().catch(() => {}); voiceCtx = null; }
    const blob = new Blob(voiceChunks, { type: "audio/webm" });
    if (blob.size < 1000) { listenOnce(); return; }

    voicePanel("Working on it", "Sending the list.");
    await sendAudio(blob);
    if (voiceStream && !voiceMuted) listenOnce();
  }

  // ── boot ─────────────────────────────────────────────────────────────────
  $("chat").innerHTML = welcome();
  renderComposer();
  $("menuBtn").onclick = openDrawer;
  $("scrim").onclick = closeDrawer;
  $("newOrder").onclick = async () => {
    try {
      const created = await api("/api/sessions", { method: "POST", headers: headers() });
      sessionId = created.id;
      lastCards = [];
      $("chat").innerHTML = welcome();
      closeDrawer();
    } catch (e) {
      addError(e.message || String(e));
    }
  };
  loadSessions();
})();
</script>
</body>
</html>
